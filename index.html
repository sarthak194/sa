<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffafcc, #ffc8dd, #cdb4db);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(190, 49, 68, 0.3);
            position: relative;
            z-index: 2;
            border: 8px solid #ff8fab;
        }
        
        h1 {
            color: #d63384;
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #ffc8dd;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: #590d22;
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .heart-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        
        .heart {
            color: #ff4d6d;
            font-size: 2.5rem;
            animation: pulse 1.5s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.3); }
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
            position: relative;
            min-height: 120px;
        }
        
        .valentine-btn {
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        #yes-btn {
            background: linear-gradient(to right, #38b000, #70e000);
            color: white;
            position: relative;
            z-index: 3;
        }
        
        #no-btn {
            background: linear-gradient(to right, #e63946, #ff758f);
            color: white;
            position: absolute;
            z-index: 4;
        }
        
        .valentine-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
        }
        
        .valentine-btn:active {
            transform: translateY(0);
        }
        
        .response-message {
            font-size: 1.8rem;
            color: #d63384;
            margin-top: 30px;
            min-height: 140px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 20px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .show {
            opacity: 1 !important;
        }
        
        .hearts-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .heart-bg {
            position: absolute;
            color: rgba(255, 77, 109, 0.15);
            font-size: 2rem;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }
        
        .footer {
            margin-top: 30px;
            color: #590d22;
            font-size: 1rem;
            text-align: center;
            padding: 15px;
        }
        
        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.3rem;
            }
            
            .valentine-btn {
                padding: 18px 30px;
                font-size: 1.5rem;
            }
            
            .response-message {
                font-size: 1.6rem;
                min-height: 160px;
                padding: 15px;
            }
            
            .container {
                padding: 20px 15px;
            }
            
            .buttons-container {
                min-height: 150px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .valentine-btn {
                padding: 15px 25px;
                font-size: 1.3rem;
            }
            
            .response-message {
                font-size: 1.4rem;
                min-height: 180px;
                padding: 12px;
            }
            
            .heart {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-background" id="hearts-bg"></div>
    
    <div class="container">
        <h1>Will You Be My Valentine?</h1>
        <div class="subtitle">Tap anywhere on screen to make "Yes" button bigger!</div>
        
        <div class="heart-container">
            <div class="heart"><i class="fas fa-heart"></i></div>
            <div class="heart"><i class="fas fa-heart"></i></div>
            <div class="heart"><i class="fas fa-heart"></i></div>
            <div class="heart"><i class="fas fa-heart"></i></div>
            <div class="heart"><i class="fas fa-heart"></i></div>
        </div>
        
        <div class="buttons-container">
            <button class="valentine-btn" id="yes-btn">
                <i class="fas fa-heart"></i> Yes! <i class="fas fa-heart"></i>
            </button>
            <button class="valentine-btn" id="no-btn">
                <i class="fas fa-times-circle"></i> No <i class="fas fa-times-circle"></i>
            </button>
        </div>
        
        <div class="response-message" id="response-message"></div>
        
        <div class="email-notice" style="margin-top: 20px; color: #590d22; font-size: 1rem; display: none;" id="email-notice">
            <i class="fas fa-envelope"></i> Your email app will open to send your response!
        </div>
    </div>
    
    <div class="footer">
        Made with <i class="fas fa-heart" style="color:#e63946;"></i> for Valentine's Day
    </div>

    <script>
        // DOM Elements
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const responseMessage = document.getElementById('response-message');
        const heartsBg = document.getElementById('hearts-bg');
        const emailNotice = document.getElementById('email-notice');
        
        // State variables
        let yesSize = 1;
        let isYesClicked = false;
        
        // Create floating hearts in background
        function createFloatingHearts() {
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-bg');
                heart.innerHTML = '<i class="fas fa-heart"></i>';
                
                // Random position and size
                const size = Math.random() * 30 + 20;
                const left = Math.random() * 100;
                const delay = Math.random() * 15;
                
                heart.style.fontSize = `${size}px`;
                heart.style.left = `${left}vw`;
                heart.style.animationDelay = `${delay}s`;
                
                heartsBg.appendChild(heart);
            }
        }
        
        // Move the "No" button to a random position
        function moveNoButton() {
            if (isYesClicked) return;
            
            const container = document.querySelector('.buttons-container');
            const containerRect = container.getBoundingClientRect();
            const buttonRect = noBtn.getBoundingClientRect();
            
            // Calculate max positions within container
            const maxX = containerRect.width - buttonRect.width;
            const maxY = containerRect.height - buttonRect.height;
            
            // Generate random position
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            // Apply new position
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }
        
        // Increase size of the "Yes" button
        function increaseYesButton() {
            if (isYesClicked) return;
            
            yesSize += 0.1;
            yesBtn.style.transform = `scale(${yesSize})`;
        }
        
        // Send email response
        function sendEmailResponse() {
            // CHANGE THIS EMAIL TO YOUR ACTUAL EMAIL ADDRESS
            const recipientEmail = "youremail@example.com";
            
            const subject = "Yes! I'll Be Your Valentine! 💝";
            const body = `I just accepted your Valentine's invitation on your website!\n\n` +
                        `The "Yes" button grew to ${Math.round(yesSize * 100)}% before I clicked it!\n\n` +
                        `Thank you for asking — I'm really looking forward to sharing Valentine's Day with you ❤️`;
            
            // Encode the subject and body for URL
            const encodedSubject = encodeURIComponent(subject);
            const encodedBody = encodeURIComponent(body);
            
            // Create the mailto link
            const mailtoLink = `mailto:${recipientEmail}?subject=${encodedSubject}&body=${encodedBody}`;
            
            // Show notice that email will open
            emailNotice.style.display = 'block';
            
            // Open email client after a short delay
            setTimeout(() => {
                window.location.href = mailtoLink;
            }, 1500);
        }
        
        // Handle "Yes" button click
        function handleYesClick() {
            if (isYesClicked) return;
            
            isYesClicked = true;
            
            // Show your custom response message
            const customMessage = "That just made me smile more than you know.<br><br>" +
                                 "I'm really looking forward to sharing Valentine's Day with you — " +
                                 "the laughs, the little moments, and whatever memories we create together.<br><br>" +
                                 "Thank you for choosing this with me ❤️";
            
            responseMessage.innerHTML = customMessage;
            responseMessage.classList.add('show');
            
            // Send email response
            sendEmailResponse();
            
            // Create celebration effect
            createCelebrationHearts();
            
            // Reset button positions
            noBtn.style.position = 'relative';
            noBtn.style.left = '0';
            noBtn.style.top = '0';
        }
        
        // Create celebration hearts when Yes is clicked
        function createCelebrationHearts() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '<i class="fas fa-heart"></i>';
                    heart.style.position = 'fixed';
                    heart.style.color = ['#ff4d6d', '#ff8fab', '#ffafcc', '#c9184a'][Math.floor(Math.random() * 4)];
                    heart.style.fontSize = `${Math.random() * 30 + 20}px`;
                    heart.style.left = `${Math.random() * 100}vw`;
                    heart.style.top = `${Math.random() * 100}vh`;
                    heart.style.zIndex = '9999';
                    heart.style.pointerEvents = 'none';
                    heart.style.opacity = '0.9';
                    
                    // Add animation
                    heart.style.animation = `pulse 0.5s ease-out ${Math.random() * 0.5}s both, floatUp 3s ease-out ${Math.random() * 0.5}s both`;
                    
                    // Add custom keyframes for floatUp
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes floatUp {
                            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
                            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
                        }
                    `;
                    document.head.appendChild(style);
                    
                    document.body.appendChild(heart);
                    
                    // Remove heart after animation completes
                    setTimeout(() => {
                        if (heart.parentNode) {
                            heart.parentNode.removeChild(heart);
                        }
                    }, 3500);
                }, i * 50);
            }
        }
        
        // Handle "No" button click
        function handleNoClick() {
            if (isYesClicked) return;
            
            const messages = [
                "Are you sure? Give it another thought!",
                "Maybe try the other button?",
                "I think you clicked the wrong button!",
                "The Yes button is much more fun!",
                "Don't be shy, try the green one!"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            responseMessage.textContent = randomMessage;
            responseMessage.classList.add('show');
            
            // Hide message after 2 seconds
            setTimeout(() => {
                responseMessage.classList.remove('show');
            }, 2000);
            
            // Move button to a new random position
            moveNoButton();
        }
        
        // Handle touch anywhere on the screen (but not on buttons)
        function handleScreenTouch(event) {
            if (isYesClicked) return;
            
            // Check if the click/touch was on one of the buttons
            const clickedElement = event.target;
            if (clickedElement === yesBtn || clickedElement === noBtn || 
                clickedElement.closest('#yes-btn') || clickedElement.closest('#no-btn')) {
                return; // Don't do anything if clicking a button
            }
            
            // Increase Yes button size
            increaseYesButton();
            
            // Move No button
            moveNoButton();
        }
        
        // Initialize the page
        function init() {
            // Create background hearts
            createFloatingHearts();
            
            // Set initial transform on Yes button
            yesBtn.style.transform = `scale(${yesSize})`;
            yesBtn.style.transformOrigin = 'center';
            
            // Add event listeners
            yesBtn.addEventListener('click', handleYesClick);
            noBtn.addEventListener('click', handleNoClick);
            
            // Add touch event to entire document for mobile
            document.addEventListener('touchstart', handleScreenTouch);
            
            // Add click event for desktop
            document.addEventListener('click', handleScreenTouch);
            
            // Initial movement of No button
            moveNoButton();
            
            // Move No button every 3 seconds
            setInterval(moveNoButton, 3000);
        }
        
        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
